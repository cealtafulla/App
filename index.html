<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">

  <title>CE Altafulla</title>

  <!-- Icona per iPhone -->
  <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png">

  <!-- Manifest PWA -->
  <link rel="manifest" href="manifest.json">

  <!-- Estils -->
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #000;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }

    #logo {
      width: 160px;
      margin-bottom: 30px;
    }

    #entrar {
      background-color: #f4c400;
      color: black;
      padding: 15px 40px;
      border: none;
      border-radius: 8px;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
    }

    #loader {
      display: none;
      margin-top: 20px;
      font-size: 18px;
    }
  </style>
</head>

<body>

  <!-- Logo -->
  <img id="logo" src="icon-192.png" alt="CE Altafulla">

  <!-- Botó Entrar -->
  <button id="entrar" onclick="entrar()">ENTRAR</button>

  <!-- Loader -->
  <div id="loader">Carregant...</div>

  <!-- Script: Obrir navegador per defecte -->
  <script>
  function entrar() {
    document.getElementById("loader").style.display = "block";

    setTimeout(function() {
      window.open(
        "https://sites.google.com/view/cealtafullaentradaprincipal/p%C3%A0gina-principal",
        "_blank",
        "noopener,noreferrer"
      );
    }, 600);
  }
</script>

  <!-- Registrar Service Worker -->
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./service-worker.js")
        .then(() => console.log("Service Worker registrat"))
        .catch((err) => console.log("Error SW:", err));
    }
  </script>

</body>
</html>
