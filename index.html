<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CE Altafulla</title>

  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png">

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #000;
      color: white;
      text-align: center;
      padding-top: 70px;
    }

    .container {
      padding: 20px;
    }

    .logo {
      width: 150px;
      margin-bottom: 25px;
      filter: drop-shadow(0 0 6px rgba(255,255,255,0.4));
    }

    .subtitle {
      font-size: 20px;
      margin-bottom: 30px;
      opacity: 0.9;
    }

    .btn {
      background: #f4c400;
      color: black;
      padding: 18px 40px;
      font-size: 22px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 600;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
      transition: 0.2s;
    }

    .btn:active {
      transform: scale(0.96);
    }

    #loader {
      display: none;
      margin-top: 30px;
      font-size: 18px;
      opacity: 0.8;
    }

    .spinner {
      margin: 15px auto;
      width: 40px;
      height: 40px;
      border: 4px solid #f4c400;
      border-top: 4px solid transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>

  <script>
    function entrar() {
      document.getElementById("loader").style.display = "block";
      setTimeout(function() {
        window.location.href = "https://sites.google.com/view/cealtafullaentradaprincipal/p%C3%A0gina-principal";
      }, 600);
    }
  </script>

</head>
<body>

  <div class="container">
    <img src="icon-192.png" class="logo" alt="Escut CE Altafulla">

    <div class="subtitle">Accés a la pàgina oficial del club</div>

    <button class="btn" onclick="entrar()">Entrar</button>

    <div id="loader">
      <div class="spinner"></div>
      Carregant…
    </div>
  </div>

</body>
</html>
